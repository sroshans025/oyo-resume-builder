  version: 1.0.0
  description: REST API for resumes, analysis, job matching, applications, interview
    practice and career planning.
paths:
  /api/admin/audit-events/:
    get:
      operationId: admin_audit_events_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/admin/cohorts/:
    post:
      operationId: admin_cohorts_create
      summary: Create an institution cohort and assign a coordinator (admin)
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/overview/:
    get:
      operationId: admin_overview_retrieve
      summary: Service health, usage and operational counts (admin)
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/templates/:
