    put:
      operationId: admin_templates_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTemplateRequest'
      security:
      - sessionAuth: []
